<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Простое бенто</title>
<style>
  body {
    background: #111;
    font-family: sans-serif;
    padding: 20px;
    margin: 0;
  }

  .bento {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 140px;
    gap: 12px;
    max-width: 800px;
    margin: 0 auto;
  }

  .box {
    background: #6b46c1;
    border-radius: 20px;
    padding: 20px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
  }

  .wide  { grid-column: span 2; }
  .tall  { grid-row: span 2; }
  .big   { grid-column: span 2; grid-row: span 2; }
</style>
</head>
<body>

  <div class="bento">
    <div class="box tall">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box tall">4</div>
    <div class="box">5</div>
    <div class="box wide">6</div>
    <div class="box wide">7</div>
    <div class="box">8</div>
    <div class="box tall">9</div>
  </div>

</body>
</html>
